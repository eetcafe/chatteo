<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatTEO - Admin Dashboard</title>
  
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #1a1a24; color: #fff; display: flex; height: 100vh; padding: 20px; gap: 20px; }
    
    #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a24; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    
    .sidebar { width: 320px; background: #252538; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
    .chat-container { flex: 1; background: #252538; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
    h2, h3 { margin-bottom: 15px; }
    
    .user-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    .user-item { padding: 10px; background: #1a1a24; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
    .user-item:hover, .user-item.active { border-color: #2563eb; background: #2d2d42; }
    
    #messages { flex: 1; background: #1a1a24; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #3b3b54; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-word; }
    .message.user { background: #374151; align-self: flex-start; }
    .message.admin { background: #2563eb; align-self: flex-end; margin-left: auto; }
    
    .input-area { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #3b3b54; background: #1a1a24; color: #fff; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .admin-actions { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #3b3b54; padding-top: 15px; }
    .btn-ban { background: #dc2626; }
    .btn-ban:hover { background: #b91c1c; }
    .btn-ai { background: #8b5cf6; }
    .btn-ai:hover { background: #7c3aed; }
    .btn-logout { background: #4b5563; }
    .btn-logout:hover { background: #374151; }
  </style>
</head>
<body>

  <!-- LOADING & ERROR SCREEN -->
  <div id="loadingScreen">
    <h2 id="statusText">Betöltés...</h2>
    <p id="errorDetail" style="color: #ef4444; margin-top: 10px; font-weight: bold;"></p>
    <p id="uidDisplay" style="color: #9ca3af; margin-top: 10px; font-size: 0.85rem;"></p>
    <button id="manualLogoutBtn" style="margin-top: 20px; display: none; background: #dc2626;">Kijelentkezés</button>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>🛠️ Admin Panel</h2>
    <h3>Aktív userek</h3>
    <div id="userList" class="user-list">
      <div style="color: #9ca3af; font-size: 0.9rem;">Várakozás userekre...</div>
    </div>

    <!-- ADMIN AKCIÓK (BAN / ADD AI / KIJELENTKEZÉS) -->
    <div class="admin-actions">
      <button id="addAiBtn" class="btn-ai" disabled>🤖 AI Mód Be/Ki</button>
      <button id="banUserBtn" class="btn-ban" disabled>🚫 User Tiltása (Ban)</button>
      <button id="logoutBtn" class="btn-logout">🚪 Kijelentkezés</button>
    </div>
  </div>

  <!-- CHAT WINDOW -->
  <div class="chat-container">
    <h2 id="chatHeader">Válassz ki egy felhasználót a bal oldalon!</h2>
    <div id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Írj választ az admin nevében..." disabled>
      <button id="sendBtn" disabled>Küldés</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAtF2vk9I59i6lEVftbFshlEHCHQXQ0-XM",
      authDomain: "chatteo-5ffe4.firebaseapp.com",
      projectId: "chatteo-5ffe4",
      storageBucket: "chatteo-5ffe4.firebasestorage.app",
      messagingSenderId: "238818745354",
      appId: "1:238818745354:web:f61067f8975a67e95913f3"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
    const socket = io("https://chatteo.onrender.com");

    let selectedUserId = null;
    let selectedUserEmail = null;
    const activeUsersMap = new Map();

    const loadingScreen = document.getElementById('loadingScreen');
    const statusText = document.getElementById('statusText');
    const errorDetail = document.getElementById('errorDetail');
    const uidDisplay = document.getElementById('uidDisplay');
    const manualLogoutBtn = document.getElementById('manualLogoutBtn');

    const userListDiv = document.getElementById('userList');
    const messagesDiv = document.getElementById('messages');
    const chatHeader = document.getElementById('chatHeader');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const banUserBtn = document.getElementById('banUserBtn');
    const addAiBtn = document.getElementById('addAiBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    // AUTH CHECK
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      uidDisplay.innerText = "A te Firebase UID azonosítód: " + user.uid;

      try {
        statusText.innerText = "Jogosultságok ellenőrzése...";
        const userDoc = await db.collection('users').doc(user.uid).get();

        if (userDoc.exists && (userDoc.data().role === 'admin' || userDoc.data().role === 'ai')) {
          loadingScreen.style.display = 'none';
          socket.emit('joinRoom', { 
            userId: user.uid, 
            email: user.email, 
            role: userDoc.data().role 
          });
        } else {
          statusText.innerText = "❌ Hozzáférés Megtagadva";
          errorDetail.innerText = `A(z) "${user.email}" fiók nem rendelkezik Admin jogosultsággal!`;
          manualLogoutBtn.style.display = 'block';
        }
      } catch (err) {
        statusText.innerText = "❌ Firestore Hiba";
        errorDetail.innerText = err.message;
        manualLogoutBtn.style.display = 'block';
      }
    });

    manualLogoutBtn.addEventListener('click', () => {
      auth.signOut().then(() => window.location.href = 'index.html');
    });

    // SOCKET EVENTS
    socket.on('userConnected', ({ userId, email }) => {
      if (userId && !activeUsersMap.has(userId)) {
        activeUsersMap.set(userId, email || userId);
        renderUserList();
      }
    });

    socket.on('userDisconnected', ({ userId }) => {
      activeUsersMap.delete(userId);
      if (selectedUserId === userId) {
        deselectUser("A kiválasztott user lekapcsolódott.");
      }
      renderUserList();
    });

    function renderUserList() {
      userListDiv.innerHTML = '';
      if (activeUsersMap.size === 0) {
        userListDiv.innerHTML = '<div style="color: #9ca3af; font-size: 0.9rem;">Nincs aktív user.</div>';
        return;
      }

      activeUsersMap.forEach((email, userId) => {
        const item = document.createElement('div');
        item.className = `user-item ${selectedUserId === userId ? 'active' : ''}`;
        item.innerText = email;
        item.onclick = () => selectUser(userId, email);
        userListDiv.appendChild(item);
      });
    }

    function selectUser(userId, email) {
      selectedUserId = userId;
      selectedUserEmail = email;
      chatHeader.innerText = `Chat vele: ${email}`;
      
      msgInput.disabled = false;
      sendBtn.disabled = false;
      banUserBtn.disabled = false;
      addAiBtn.disabled = false;
      
      renderUserList();
      messagesDiv.innerHTML = '';
    }

    function deselectUser(message) {
      selectedUserId = null;
      selectedUserEmail = null;
      chatHeader.innerText = message || "Válassz ki egy felhasználót!";
      msgInput.disabled = true;
      sendBtn.disabled = true;
      banUserBtn.disabled = true;
      addAiBtn.disabled = true;
    }

    socket.on('messageToAdmin', (msg) => {
      if (msg.senderId && !activeUsersMap.has(msg.senderId)) {
        activeUsersMap.set(msg.senderId, msg.sender || msg.senderId);
        renderUserList();
      }

      if (selectedUserId === msg.senderId) {
        appendMessage(msg.sender, msg.text, 'user');
      }
    });

    // CHAT MESSAGE SENDING
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
      const text = msgInput.value.trim();
      if (text && selectedUserId) {
        socket.emit('chatMessage', {
          targetUserId: selectedUserId,
          text: text,
          sender: 'Admin'
        });

        appendMessage('Admin', text, 'admin');
        msgInput.value = '';
      }
    }

    function appendMessage(sender, text, type) {
      const item = document.createElement('div');
      item.className = `message ${type}`;
      item.innerText = `${sender}: ${text}`;
      messagesDiv.appendChild(item);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // --- BAN USER FUNKCIÓ ---
    banUserBtn.addEventListener('click', async () => {
      if (!selectedUserId) return;

      const reason = prompt(`Mi a tiltás oka a(z) ${selectedUserEmail} felhasználónak?`, "Szabályzat megszegése");
      if (reason !== null) {
        try {
          // Beállítjuk a Firestore-ban a banned mezőt
          await db.collection('users').doc(selectedUserId).set({
            banned: true,
            banReason: reason
          }, { merge: true });

          alert(`Felhasználó (${selectedUserEmail}) sikeresen letiltva!`);
          deselectUser("A felhasználó le lett tiltva.");
        } catch (err) {
          alert("Hiba a tiltás során: " + err.message);
        }
      }
    });

    // --- ADD AI / TOGGLE AI ROLE FUNKCIÓ ---
    addAiBtn.addEventListener('click', async () => {
      if (!selectedUserId) return;

      try {
        const userDoc = await db.collection('users').doc(selectedUserId).get();
        const currentRole = userDoc.exists ? userDoc.data().role : 'user';
        const newRole = currentRole === 'ai' ? 'user' : 'ai';

        await db.collection('users').doc(selectedUserId).set({
          role: newRole
        }, { merge: true });

        alert(`Felhasználó szerepköre frissítve: ${newRole.toUpperCase()}`);
      } catch (err) {
        alert("Hiba a szerepkör módosításakor: " + err.message);
      }
    });

    // --- KIJELENTKEZÉS ---
    logoutBtn.addEventListener('click', () => {
      auth.signOut().then(() => window.location.href = 'index.html');
    });
  </script>
</body>
</html>
