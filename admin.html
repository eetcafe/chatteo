<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatTEO - Admin Dashboard</title>
  
  <!-- Socket.IO Client CDN -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #1a1a24; color: #fff; display: flex; height: 100vh; padding: 20px; gap: 20px; }
    .sidebar { width: 300px; background: #252538; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
    .chat-container { flex: 1; background: #252538; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
    h2, h3 { margin-bottom: 15px; }
    .user-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .user-item { padding: 10px; background: #1a1a24; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
    .user-item:hover, .user-item.active { border-color: #2563eb; background: #2d2d42; }
    #messages { flex: 1; background: #1a1a24; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #3b3b54; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-word; }
    .message.user { background: #374151; align-self: flex-start; }
    .message.admin { background: #2563eb; align-self: flex-end; margin-left: auto; }
    .input-area { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #3b3b54; background: #1a1a24; color: #fff; }
    button { padding: 12px 24px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
    .logout-btn { background: #dc2626; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- OLDALSÁV: AKTÍV USEREK LISTÁJA -->
  <div class="sidebar">
    <h2>🛠️ Admin Panel</h2>
    <h3>Aktív userek</h3>
    <div id="userList" class="user-list">
      <div style="color: #9ca3af; font-size: 0.9rem;">Várakozás userekre...</div>
    </div>
    <button id="logoutBtn" class="logout-btn">Kijelentkezés</button>
  </div>

  <!-- CHAT ABLAK A KIVÁLASZTOTT USERREL -->
  <div class="chat-container">
    <h2 id="chatHeader">Válassz ki egy felhasználót a bal oldalon!</h2>
    <div id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Írj választ az admin/AI nevében..." disabled>
      <button id="sendBtn" disabled>Küldés</button>
    </div>
  </div>

  <script>
    // 1. FIREBASE CONFIG (Cseréld ki a saját adataidra!)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    // 2. SOCKET.IO CSATLAKOZÁS
    const socket = io("https://chatteo.onrender.com");

    let selectedUserId = null;
    const activeUsersMap = new Map(); // userId -> email

    const userListDiv = document.getElementById('userList');
    const messagesDiv = document.getElementById('messages');
    const chatHeader = document.getElementById('chatHeader');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    // 3. SAFE AUTH CIKLUS ÉS ROLE-CHECK (Átirányítási hurok elleni védelemmel)
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const userDoc = await db.collection('users').doc(user.uid).get();

        if (userDoc.exists) {
          const userData = userDoc.data();
          if (userData.role === 'admin' || userData.role === 'ai') {
            console.log("Admin jogosultság elfogadva.");
            socket.emit('joinRoom', { 
              userId: user.uid, 
              email: user.email, 
              role: userData.role 
            });
          } else {
            console.warn("Nem admin fiók, visszanavigálás...");
            window.location.href = 'index.html';
          }
        } else {
          // Ha még nincs rekordja a Firestore-ban, létrehozzuk admin role-lal
          await db.collection('users').doc(user.uid).set({
            email: user.email,
            role: 'admin',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          socket.emit('joinRoom', { 
            userId: user.uid, 
            email: user.email, 
            role: 'admin' 
          });
        }
      } catch (err) {
        console.error("Firestore ellenőrzési hiba:", err);
      }
    });

    // 4. USEREK KEZELÉSE A BAL OLDALI SÁVBAN
    socket.on('userConnected', ({ userId, email }) => {
      if (userId && !activeUsersMap.has(userId)) {
        activeUsersMap.set(userId, email || userId);
        renderUserList();
      }
    });

    socket.on('userDisconnected', ({ userId }) => {
      activeUsersMap.delete(userId);
      if (selectedUserId === userId) {
        selectedUserId = null;
        chatHeader.innerText = "A kiválasztott user lekapcsolódott.";
        msgInput.disabled = true;
        sendBtn.disabled = true;
      }
      renderUserList();
    });

    function renderUserList() {
      userListDiv.innerHTML = '';
      if (activeUsersMap.size === 0) {
        userListDiv.innerHTML = '<div style="color: #9ca3af; font-size: 0.9rem;">Nincs aktív user.</div>';
        return;
      }

      activeUsersMap.forEach((email, userId) => {
        const item = document.createElement('div');
        item.className = `user-item ${selectedUserId === userId ? 'active' : ''}`;
        item.innerText = email;
        item.onclick = () => selectUser(userId, email);
        userListDiv.appendChild(item);
      });
    }

    function selectUser(userId, email) {
      selectedUserId = userId;
      chatHeader.innerText = `Chat vele: ${email}`;
      msgInput.disabled = false;
      sendBtn.disabled = false;
      renderUserList();
      messagesDiv.innerHTML = ''; // Töröljük az előző user üzeneteit a nézetből
    }

    // 5. ÜZENET ÉRKEZÉSE A USERTŐL (`messageToAdmin` CSATORNÁN)
    socket.on('messageToAdmin', (msg) => {
      if (msg.senderId && !activeUsersMap.has(msg.senderId)) {
        activeUsersMap.set(msg.senderId, msg.sender || msg.senderId);
        renderUserList();
      }

      // Csak akkor jelenítjük meg a chat ablakban, ha a küldő user van kijelölve
      if (selectedUserId === msg.senderId) {
        appendMessage(msg.sender, msg.text, 'user');
      }
    });

    // 6. ÜZENETKÜLDÉS AZ ADMIN RÉSZÉRŐL
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const text = msgInput.value.trim();
      if (text && selectedUserId) {
        socket.emit('chatMessage', {
          targetUserId: selectedUserId,
          text: text,
          sender: 'Admin'
        });

        appendMessage('Admin', text, 'admin');
        msgInput.value = '';
      }
    }

    function appendMessage(sender, text, type) {
      const item = document.createElement('div');
      item.className = `message ${type}`;
      item.innerText = `${sender}: ${text}`;
      messagesDiv.appendChild(item);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // KIJELENTKEZÉS
    logoutBtn.addEventListener('click', () => {
      auth.signOut().then(() => {
        window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
